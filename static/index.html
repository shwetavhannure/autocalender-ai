<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Deadline Auto-Pilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-slate-800 text-center relative overflow-hidden">
        <!-- Decorative background glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-6 border border-indigo-500/20 text-3xl shadow-inner">
            🚀
        </div>
        
        <h1 class="text-2xl font-extrabold tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-400 to-cyan-400">
            AI Deadline Auto-Pilot
        </h1>
        <p class="text-slate-400 text-sm mb-8 leading-relaxed">
            Syncs your university announcement emails directly to your Google Calendar using open-source language models.
        </p>

        <div class="bg-slate-950/60 rounded-2xl p-6 border border-slate-800/80 mb-6 text-left shadow-inner">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">System Status</span>
                <div class="flex items-center space-x-2 text-xs text-amber-400 font-medium">
                    <span class="h-2 w-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span>Account Integration Required</span>
                </div>
            </div>
            
            <a href="/login" class="flex w-full items-center justify-center space-x-2 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-semibold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/20">
                <span>Connect Google Workspace</span>
                <span>→</span>
            </a>
        </div>

        <div class="text-xs text-slate-500 tracking-wide">
            Secured via official Google OAuth 2.0 API guidelines.
        </div>
    </div>
</body>
</html>
